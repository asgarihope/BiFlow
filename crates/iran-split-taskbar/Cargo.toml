[package]
name = "iran-split-taskbar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
iran-split-config = { path = "../iran-split-config" }
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = [
  "NSArray",
  "NSAttributedString",
  "NSDictionary",
  "NSObject",
  "NSString",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "NSApplication",
  "NSAttributedString",
  "NSButton",
  "NSColor",
  "NSControl",
  "NSFont",
  "NSImage",
  "NSFontDescriptor",
  "NSParagraphStyle",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
  "std",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.1", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

# Win32 pointers and callbacks are confined to this native boundary, as with
# helper-winacl. The desktop and all other crates retain unsafe_code=forbid.
[lints.rust]
unsafe_code = "allow"
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
