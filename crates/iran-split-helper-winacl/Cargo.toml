[package]
name = "iran-split-helper-winacl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
iran-split-config.workspace = true
tokio.workspace = true
windows = { version = "0.61.1", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_UI",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "allow"
unused = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"

# `tray_icon` is a pure bitmap renderer with no Win32 APIs; the pedantic
# cast / float / module-name lints are honest noise for a 32×32 RGBA
# builder.
[lints.clippy.module_name_repetitions]
level = "allow"
[lints.clippy.cast_possible_truncation]
level = "allow"
[lints.clippy.cast_possible_wrap]
level = "allow"
[lints.clippy.cast_precision_loss]
level = "allow"
[lints.clippy.cast_sign_loss]
level = "allow"
[lints.clippy.cast_lossless]
level = "allow"
[lints.clippy.must_use_candidate]
level = "allow"
[lints.clippy.min_ident_chars]
level = "allow"
[lints.clippy.needless_pass_by_value]
level = "allow"
[lints.clippy.identity_op]
level = "allow"
