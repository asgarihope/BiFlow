name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Tag v* publishes Linux .deb + AppImage, Windows portable .exe + NSIS, and the
# macOS disk image. A push to main publishes the same release when that version
# does not already have a finished GitHub release (ADR 0123). Third-party VPN
# apps stay in-app (ADR 0004); this workflow does not vendor them.
# Build jobs only upload workflow artifacts. The final job publishes them together.
# Native runners follow the official Tauri GitHub pipeline: Linux WebKitGTK 4.1 on
# Ubuntu 22.04 and 24.04, Windows MSVC + WebView2 on windows-2025. The 22.04
# packages are extra release assets (`*_ubuntu2204_*`) because that glibc is
# too old for a binary built on 24.04. Updater latest.json stays on the 24.04
# deb and AppImage, plus the signed Apple Silicon disk image (ADR 0126).
# Do not cross-compile the Windows installer from Linux here;
# the Linux Tauri CLI rejects --bundles nsis.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version still needs a release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version)"
          tag="v${version}"
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version file ${tag}"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if view="$(gh release view "${tag}" --json isDraft 2>/dev/null)"; then
            draft="$(printf '%s' "${view}" | jq -r '.isDraft')"
            if [ "${draft}" = "true" ]; then
              echo "publish=true" >> "${GITHUB_OUTPUT}"
            else
              echo "Release ${tag} is already published"
              echo "publish=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: ubuntu-24.04
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils && pkg-config --exists webkit2gtk-4.1
      - run: pnpm install --frozen-lockfile
      - name: Python for script contract tests
        run: python3 --version
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest glibc this release supports. Its
          # packages are renamed so they do not replace the Ubuntu 24.04
          # updater assets, which depend on the t64 library names.
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: ubuntu-24.04
            args: --bundles deb,appimage
          - platform: windows-2025
            args: --bundles nsis
          - platform: macos-15
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Disable CRLF conversion on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: ${{ matrix.platform }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          fuse2=libfuse2
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            fuse2=libfuse2t64
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils "$fuse2"
          pkg-config --exists webkit2gtk-4.1
      - name: Prefetch AppImage tools
        if: runner.os == 'Linux'
        run: ./scripts/prefetch-appimage-tools.sh
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisDirs = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "${env:ProgramFiles}\NSIS"
          )
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            foreach ($nsis in $nsisDirs) {
              if (Test-Path $nsis) {
                Add-Content -Path $env:GITHUB_PATH -Value $nsis
                $env:Path = "$nsis;$env:Path"
              }
            }
            if (Get-Command makensis -ErrorAction SilentlyContinue) {
              makensis /VERSION
              if ($LASTEXITCODE -eq 0) { break }
            }
            if ($attempt -eq 3) { throw "NSIS is unavailable after 3 installation attempts" }
            Write-Host "NSIS is unavailable; retrying installation ($attempt/3)"
            Start-Sleep -Seconds (10 * $attempt)
          }
          Get-Command makensis -ErrorAction Stop
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-tauri-signing.mjs --require --github-env --verify-sign
      - name: Stage privileged helper
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./scripts/stage-helper.sh windows
          else
            ./scripts/stage-helper.sh
          fi
      - uses: tauri-apps/tauri-action@v1
        if: runner.os != 'macOS'
        with:
          args: ${{ matrix.args }}
      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: ./build.sh ci-macos
      - name: Mark Ubuntu 22.04 packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" != "ubuntu-22.04" ]; then
            exit 0
          fi
          shopt -s nullglob
          for path in \
            target/release/bundle/deb/*.deb \
            target/release/bundle/deb/*.deb.sig \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/appimage/*.AppImage.sig
          do
            base="$(basename "$path")"
            case "$base" in
              *_ubuntu2204_*) continue ;;
            esac
            dir="$(dirname "$path")"
            mv "$path" "$dir/${base/_amd64/_ubuntu2204_amd64}"
          done
      - name: Sign Debian updater package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          (( ${#debs[@]} == 1 )) || { echo "Expected one Debian package to sign"; exit 1; }
          TAURI_PRIVATE_KEY="${TAURI_SIGNING_PRIVATE_KEY}" \
            TAURI_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
            pnpm exec tauri signer sign "${debs[0]}"
      - name: Sign macOS updater package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/macos/*.dmg)
          (( ${#dmgs[@]} == 1 )) || { echo "Expected one macOS disk image to sign"; exit 1; }
          TAURI_PRIVATE_KEY="${TAURI_SIGNING_PRIVATE_KEY}" \
            TAURI_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
            pnpm exec tauri signer sign "${dmgs[0]}"
          [[ -f "${dmgs[0]}.sig" ]] || { echo "macOS updater signature was not written"; exit 1; }
      - name: Stage portable Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="target/release/iran-split-desktop.exe"
          test -f "${exe}"
          cp "${exe}" BiFlow.exe
      - name: Upload Linux release artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.platform }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows release artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            BiFlow.exe
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS release artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.dmg.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate and validate latest.json
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/generate-latest-json.mjs \
            --assets release-assets \
            --tag "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --output release-assets/latest.json \
            --notes "BiFlow ${RELEASE_TAG#v}"
      - name: Validate and publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t debs < <(find release-assets -type f -name '*.deb' ! -name '*ubuntu2204*' -print | sort)
          mapfile -t deb_sigs < <(find release-assets -type f -name '*.deb.sig' ! -name '*ubuntu2204*' -print | sort)
          mapfile -t appimages < <(find release-assets -type f -name '*.AppImage' ! -name '*ubuntu2204*' -print | sort)
          mapfile -t appimage_sigs < <(find release-assets -type f -name '*.AppImage.sig' ! -name '*ubuntu2204*' -print | sort)
          mapfile -t ubuntu_debs < <(find release-assets -type f -name '*ubuntu2204*.deb' -print | sort)
          mapfile -t ubuntu_deb_sigs < <(find release-assets -type f -name '*ubuntu2204*.deb.sig' -print | sort)
          mapfile -t ubuntu_appimages < <(find release-assets -type f -name '*ubuntu2204*.AppImage' -print | sort)
          mapfile -t ubuntu_appimage_sigs < <(find release-assets -type f -name '*ubuntu2204*.AppImage.sig' -print | sort)
          mapfile -t portable < <(find release-assets -type f -name 'BiFlow.exe' -print | sort)
          mapfile -t installers < <(find release-assets -type f -name '*-setup.exe' -print | sort)
          mapfile -t installer_sigs < <(find release-assets -type f -name '*-setup.exe.sig' -print | sort)
          mapfile -t manifests < <(find release-assets -type f -name 'latest.json' -print | sort)
          mapfile -t dmgs < <(find release-assets -type f -name '*.dmg' ! -name '*.dmg.sig' -print | sort)
          mapfile -t dmg_sigs < <(find release-assets -type f -name '*.dmg.sig' -print | sort)

          if (( ${#debs[@]} != 1 || ${#deb_sigs[@]} != 1 || ${#appimages[@]} != 1 || ${#appimage_sigs[@]} != 1 || ${#ubuntu_debs[@]} != 1 || ${#ubuntu_deb_sigs[@]} != 1 || ${#ubuntu_appimages[@]} != 1 || ${#ubuntu_appimage_sigs[@]} != 1 || ${#portable[@]} != 1 || ${#installers[@]} != 1 || ${#installer_sigs[@]} != 1 || ${#manifests[@]} != 1 || ${#dmgs[@]} != 1 || ${#dmg_sigs[@]} != 1 )); then
            echo "Expected Ubuntu 24.04 and Ubuntu 22.04 deb/AppImage pairs with signatures, one portable exe, one NSIS installer and signature, one signed macOS disk image, and latest.json"
            find release-assets -type f -print
            exit 1
          fi

          tag="${RELEASE_TAG}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
          fi

          assets=("${debs[@]}" "${deb_sigs[@]}" "${appimages[@]}" "${appimage_sigs[@]}" "${ubuntu_debs[@]}" "${ubuntu_deb_sigs[@]}" "${ubuntu_appimages[@]}" "${ubuntu_appimage_sigs[@]}" "${portable[@]}" "${installers[@]}" "${installer_sigs[@]}" "${dmgs[@]}" "${dmg_sigs[@]}" "${manifests[@]}")
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --generate-notes \
              --title "BiFlow ${tag}" \
              --verify-tag
          fi
          gh release upload "${tag}" "${assets[@]}" --clobber
          gh release edit "${tag}" \
            --draft=false \
            --prerelease=false \
            --title "BiFlow ${tag}"
