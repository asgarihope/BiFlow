name: Package dry-run

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all, linux, windows)
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Non-publishing native packaging smoke test. Uploads workflow artifacts only;
# never creates or updates a GitHub Release.
# Job-level `if` cannot use the matrix context. Select platforms here, then
# expand the native OS matrix with fromJSON.

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          linux22='{"platform":"ubuntu-22.04","args":"--bundles deb,appimage --config {\"bundle\":{\"createUpdaterArtifacts\":false}}"}'
          linux24='{"platform":"ubuntu-24.04","args":"--bundles deb,appimage --config {\"bundle\":{\"createUpdaterArtifacts\":false}}"}'
          windows='{"platform":"windows-2025","args":"--bundles nsis --config {\"bundle\":{\"createUpdaterArtifacts\":false}}"}'
          case "${PLATFORM}" in
            linux) include="[${linux22},${linux24}]" ;;
            windows) include="[${windows}]" ;;
            *) include="[${linux22},${linux24},${windows}]" ;;
          esac
          echo "include=${include}" >> "${GITHUB_OUTPUT}"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Disable CRLF conversion on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: ${{ matrix.platform }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          fuse2=libfuse2
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            fuse2=libfuse2t64
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils "$fuse2"
          pkg-config --exists webkit2gtk-4.1
      - name: Prefetch AppImage tools
        if: runner.os == 'Linux'
        run: ./scripts/prefetch-appimage-tools.sh
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDirs = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "${env:ProgramFiles}\NSIS"
          )
          foreach ($nsis in $nsisDirs) {
            if (Test-Path $nsis) {
              Add-Content -Path $env:GITHUB_PATH -Value $nsis
              $env:Path = "$nsis;$env:Path"
            }
          }
          Get-Command makensis -ErrorAction Stop
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
      - name: Stage portable Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="target/release/iran-split-desktop.exe"
          test -f "${exe}"
          cp "${exe}" BiFlow.exe
      - name: Mark Ubuntu 22.04 packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" != "ubuntu-22.04" ]; then
            exit 0
          fi
          shopt -s nullglob
          for path in \
            target/release/bundle/deb/*.deb \
            target/release/bundle/appimage/*.AppImage
          do
            base="$(basename "$path")"
            case "$base" in
              *_ubuntu2204_*) continue ;;
            esac
            dir="$(dirname "$path")"
            mv "$path" "$dir/${base/_amd64/_ubuntu2204_amd64}"
          done
      - name: Upload Linux dry-run artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-linux-${{ matrix.platform }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3
      - name: Upload Windows dry-run artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-windows
          path: |
            BiFlow.exe
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3
